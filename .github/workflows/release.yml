name: Build & Release

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS – Universal binary (Apple Silicon + Intel)
          - platform: macos-latest
            args: '--target universal-apple-darwin'

          # Linux
          - platform: ubuntu-22.04
            args: ''

          # Windows
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS build needs both targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          # DEPLOY_TOKEN = GitHub PAT with Contents:write.
          # Falls back to the built-in Actions token (also has Contents:write
          # thanks to the permissions block above) when DEPLOY_TOKEN is not set.
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN || github.token }}
          # ── macOS code-signing ─────────────────────────────────────────────
          # Signing is DISABLED until proper Apple Developer certs are ready.
          # To enable: uncomment the lines below and add the 6 secrets in
          # repo Settings → Secrets → Actions.
          #
          # APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID:                   ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD:             ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}

        with:
          # build-${{ github.run_number }} suffix ensures every master merge
          # creates a unique tag — no version bump required between pushes.
          tagName: v__VERSION__-build.${{ github.run_number }}
          releaseName: Apertin v__VERSION__ (build ${{ github.run_number }})
          releaseBody: |
            ## Apertin v__VERSION__ — build ${{ github.run_number }}

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}

            ### Download
            | Platform | File |
            |----------|------|
            | macOS Universal (Apple Silicon + Intel) | `.dmg` |
            | Windows | `.msi` / `.exe` |
            | Linux | `.deb` / `.AppImage` |

            Select the correct installer for your OS from the **Assets** list below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
