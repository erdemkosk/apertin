name: Build & Release

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS – Universal binary (Apple Silicon + Intel)
          - platform: macos-latest
            args: '--target universal-apple-darwin'

          # Linux
          - platform: ubuntu-22.04
            args: ''

          # Windows
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS build needs both targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Check macOS signing secrets
        if: matrix.platform == 'macos-latest'
        id: signing
        run: |
          if [ -n "$CERT" ] && [ ${#CERT} -gt 100 ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Build & publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          # ── macOS code-signing (only active when secrets are properly configured) ──
          # To enable: add these 6 secrets to repo Settings → Secrets → Actions.
          # Until then builds are unsigned (users right-click → Open on first launch).
          APPLE_CERTIFICATE:          ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE          || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY:     ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_SIGNING_IDENTITY     || '' }}
          APPLE_ID:                   ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_ID                   || '' }}
          APPLE_PASSWORD:             ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_PASSWORD             || '' }}
          APPLE_TEAM_ID:              ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_TEAM_ID             || '' }}

        with:
          # build-${{ github.run_number }} suffix ensures every master merge
          # creates a unique tag — no version bump required between pushes.
          tagName: v__VERSION__-build.${{ github.run_number }}
          releaseName: Apertinder v__VERSION__ (build ${{ github.run_number }})
          releaseBody: |
            ## Apertinder v__VERSION__ — build ${{ github.run_number }}

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}

            ### Download
            | Platform | File |
            |----------|------|
            | macOS Universal (Apple Silicon + Intel) | `.dmg` |
            | Windows | `.msi` / `.exe` |
            | Linux | `.deb` / `.AppImage` |

            Select the correct installer for your OS from the **Assets** list below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
