[package]
name = "apertin"
version = "0.1.0"
description = "Apertin RAW Culling Engine"
authors = ["Antigravity Developer"]
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
walkdir = "2.5"
rayon = "1.10"
rfd = "0.14"
trash = "3"
open = "5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
url = "2.5"
http = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
